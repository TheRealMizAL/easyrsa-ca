name: easyrsa-ca

volumes:
  container-pki:

secrets:
  ca_pass:
    file: ./ca.pass

services:
  easyrsa:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EASYRSA_VERSION: "3.2.7"
    image: internal-pki/easyrsa:3.2.7
    container_name: easyrsa-ca
    hostname: easyrsa-ca
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
      - seccomp:seccomp-profile.json

    cap_drop:
      - ALL

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1001,gid=1001

    network_mode: none

    secrets:
      - ca_pass

    volumes:
      - container-pki:/app/data/
      - ./external-pki:/app/data/external-pki:ro
      - ./config:/app/config:ro

    stdin_open: true
    tty: false

    environment:
      EASYRSA_PASSIN: "file:/run/secrets/ca_pass"
      EASYRSA_PASSOUT: "file:/run/secrets/ca_pass"
      EASYRSA_PKI: "/app/data/pki"
      EXTERNAL_PKI: "/app/data/external-pki"
      EASYRSA_VARS_FILE: "/app/config/vars"
      EASYRSA_EXT: "/app/config/x509-types"
      TZ: "UTC"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=easyrsa-ca"

    healthcheck:
      test: [ "CMD", "test", "-f", "/app/data/pki/lock.file" ]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 15s
